# Publishing a GitHub release tagged vX.Y.Z builds the two files Foundry installs from:
# module.json (version and download link set from the tag) and module.zip.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: node --test

      - name: Build module.json and module.zip
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          jq --arg v "$version" --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
            '.version = $v | .download = $d' module.json > module.release.json
          mv module.release.json module.json
          zip -r module.zip module.json LICENSE README.md lang scripts

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" module.json module.zip --clobber
